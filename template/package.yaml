spec: 1
name: __PACKAGE_NAME__
version: 0.1.0
scope: project            # project | global
sensitivity: personal     # public | personal | sensitive | highly-sensitive
targets: [hermes, claude, codex, opencode, pi]

prompts:
  contract: AGENTS.md
  # fragments are for global-scope packages only:
  # fragments:
  #   - path: prompts/policy.md
  #     targets: [hermes, claude]

skills:
  dir: .agents/skills
  include: all
  exclude: []

connections: []
  # - connections/example.yaml

# Whole files copied verbatim into a runtime's home. Global scope only. `dest` is
# relative to the home; pi is the only runtime with a host-file backend today.
host_files: []
  # - path: identity/harness/pi/example.ts
  #   dest: .pi/agent/extensions/example.ts
  #   targets: [pi]

memory:
  schema: memory/schema.yaml
  reads_from: []

# Skills that Hermes cron jobs attach by name. Hermes resolves those from its global
# skill dirs, so agentpack registers each one there. The jobs themselves are created
# with `hermes cron create`, never by agentpack.
# hermes:
#   cron_skills: [daily-report]
